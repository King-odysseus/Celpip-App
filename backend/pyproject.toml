[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celpip-backend"
version = "0.1.0"
description = "Django/DRF backend for the CELPIP-General practice platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<5.3",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "argon2-cffi>=23.0",
    "django-cors-headers>=4.3,<5.0",
    "dj-database-url>=2.1,<3.0",
    "python-dotenv>=1.0,<2.0",
    # IANA timezone data for Windows and minimal containers.
    "tzdata>=2025.2",
    # PostgreSQL driver — configured for later phases; SQLite needs no driver.
    "psycopg[binary]>=3.1,<4.0",
    "openai>=2.0,<3.0",
    # Production WSGI server and static file serving. Both are safe to install
    # everywhere; they only change behaviour when the prod settings enable them.
    "gunicorn>=22.0,<24.0",
    "whitenoise>=6.6,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.5",
]

[tool.setuptools]
# This is an application, not an installable library package; there are no
# importable top-level packages to auto-discover from the project root.
py-modules = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Auto-generated migrations are not hand-maintained; do not lint them.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
